name: Build & Push Docker Image

on:
  push:
    branches: [main, master]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/pdf-analyzer
          tags: type=sha,type=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/pdf-analyzer:cache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/pdf-analyzer:cache,mode=max

      - name: Notify deployment
        run: |
          echo "Image pushed: ${{ steps.meta.outputs.tags }}"
          echo "Server can now run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/pdf-analyzer:latest"